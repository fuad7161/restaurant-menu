# fly.toml app configuration file generated for waiterly on 2026-11-14T18:17:40Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'waiterly'
primary_region = 'sin'

[build]
[http_service]
  internal_port = 8081
  force_https = true
  # One machine always runs: no cold start for the first guest after a quiet spell, and the
  # app's cleanup job keeps the database active.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Fly restarts the machine when /healthz fails (it also checks the database).
  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
