# Runs only the app. Data, photos and Redis are online services set in .env:
#   PostgreSQL -> Supabase, photos -> Backblaze B2, Redis -> Upstash.
#   cp .env.example .env    (then fill in the URLs and keys)
#   docker compose up --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ADDR: ":8081"
      BASE_URL: ${BASE_URL:-}   # "make up" fills this with the laptop's Wi-Fi address
    ports:
      - "${APP_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
